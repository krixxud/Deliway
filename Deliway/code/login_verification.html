    <script>
    $(document).ready(function () {
        $(document).off("keyup", ".check").on("keyup", ".check", function () {
            var self = $(this);
            var value = self.val().trim();
            var id = self.attr("id");

            if (id === "user_id") {
                $.post("PHP/id_check.php", { user_id: value }, function (data) {
                    $("#id_check").html(data);
                    if (data.includes("중복")) {
                        $("#id_check").css("color", "red");
                    } else {
                        $("#id_check").css("color", "green");
                    }
                });
            }

            if (id === "user_phone") {
                $.post("PHP/number_check.php", { user_phone: value }, function (data) {
                    console.log("user_phone:", value);
                    $("#number_check").html(data);
                    if (data.includes("중복")) {
                        $("#number_check").css("color", "red");
                    } else {
                        $("#number_check").css("color", "green");
                    }
                });
            }
        });
    });
    </script>

    <script>
        function inputPhoneNumber(obj) {
        
            var number = obj.value.replace(/[^0-9]/g, "");
            var phone = "";
        
            if(number.length < 4) {
                return number;
            } else if(number.length < 7) {
                phone += number.substr(0, 3);
                phone += "-";
                phone += number.substr(3);
            } else if(number.length < 11) {
                phone += number.substr(0, 3);
                phone += "-";
                phone += number.substr(3, 3);
                phone += "-";
                phone += number.substr(6);
            } else {
                phone += number.substr(0, 3);
                phone += "-";
                phone += number.substr(3, 4);
                phone += "-";
                phone += number.substr(7);
            }
            obj.value = phone;
        }
        </script>
