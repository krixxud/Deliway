<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 입력</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/webfont.css">
    <link rel="stylesheet" href="css/login-common.css">
    <link rel="stylesheet" href="css/login_info.css">
    <script src="./js/common.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script>
    $(document).ready(function () {
        $(document).on("keyup", ".check", function () {
            var self = $(this);
            var value = self.val().trim();
            var id = self.attr("id");

            if (id === "user_name") {
                $.post("PHP/name_check.php", { user_name: value }, function (data) {
                    $("#name_check").html(data);
                    if (data.includes("중복")) {
                        $("#name_check").css("color", "red");
                    } else {
                        $("#name_check").css("color", "green");
                    }
                });
            }
        });
    });
    </script>
</head>

<body>
    <header>
        <a href="#" onclick="goBack(event)"><i class="fas fa-angle-left" aria-hidden="true"></i><span class="hidden">뒤로가기</span></a>
        <h1 class="hidden">정보 입력</h1>
    </header>
    <main>
        <form method="post" action="./PHP/login_info_ok.php" id='loginInfo'>
            <input type="hidden" name="user_id" value="<?php echo $_GET['user_id'];?>">
            <label class="login">델리웨이에 사용할 <br>닉네임을 입력해주세요
                <input class="login-placeholder check" id="user_name" type="text" name="user_name" placeholder="닉네임을 입력해주세요" required>
            </label>
            <div id="name_check"></div>

            <div class="input-group">
                <label for="user-address" class="target">위치 설정
                    <input type="text" id="sample5_address" placeholder="주소 검색" name="user_addr">
                </label>
                <input type="button" class="map_search" onclick="sample5_execDaumPostcode()" value="검색"><br>
            </div>
            <div id="map"></div>
            <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
            <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=455d961c1f12d1c88656c0214f20de9f&libraries=services"></script>
            <script>
                var mapContainer = document.getElementById('map'), // 지도를 표시할 div
                    mapOption = {
                        center: new daum.maps.LatLng(37.537187, 127.005476), // 지도의 중심좌표
                        level: 5 // 지도의 확대 레벨
                    };

                //지도를 미리 생성
                var map = new daum.maps.Map(mapContainer, mapOption);
                //주소-좌표 변환 객체를 생성
                var geocoder = new daum.maps.services.Geocoder();
                //마커를 미리 생성
                var marker = new daum.maps.Marker({
                    position: new daum.maps.LatLng(37.537187, 127.005476),
                    map: map
                });


                function sample5_execDaumPostcode() {
                    new daum.Postcode({
                        oncomplete: function (data) {
                            var addr = data.address; // 최종 주소 변수

                            // 주소 정보를 해당 필드에 넣는다.
                            document.getElementById("sample5_address").value = addr;
                            // 주소로 상세 정보를 검색
                            geocoder.addressSearch(data.address, function (results, status) {
                                // 정상적으로 검색이 완료됐으면
                                if (status === daum.maps.services.Status.OK) {

                                    var result = results[0]; //첫번째 결과의 값을 활용

                                    // 해당 주소에 대한 좌표를 받아서
                                    var coords = new daum.maps.LatLng(result.y, result.x);
                                    // 지도를 보여준다.
                                    mapContainer.style.display = "block";
                                    map.relayout();
                                    // 지도 중심을 변경한다.
                                    map.setCenter(coords);
                                    // 마커를 결과값으로 받은 위치로 옮긴다.
                                    marker.setPosition(coords)
                                }
                            });
                        }
                    }).open();
                }
            </script>
            <button type="submit" class="next title">다음</button>
        </form>
    </main>
</body>

</html>
